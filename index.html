<body>

<div class="app-container">
    <div style="text-align: center; margin-bottom: 25px;">
        <h1 style="color: #2d3436; font-size: 24px; margin-bottom: 15px;">🌱 SMART 학급수첩</h1>
        <img src="images/main_banner.png" alt="메인 배너" style="width: 100%; max-width: 250px; border-radius: 20px;">
        <p style="color: #636e72; font-size: 14px; margin-top: 10px;">2학년 1반 아이들의 소중한 기록</p>
    </div>

    <!-- 1. 로그인 -->
    <div id="sec-login" class="section active">
        <p style="text-align: center; color: #636e72;">학급 관리 로그인 (Cloud)</p>
        <input type="text" id="c-name" class="input-field" placeholder="학급 이름 (예: 조준호)">
        <input type="password" id="c-pw" class="input-field" placeholder="비밀번호">
        <button class="btn-blue" onclick="handleLogin()">시작하기</button>
    </div>

    <!-- 2. 명부 작성 -->
    <div id="sec-setup" class="section">
        <h3>우리 반 명부 작성 (최대 30명)</h3>
        <div class="scroll-list" id="roster-inputs"></div>
        <button class="btn-blue" onclick="saveAndGoMain()">명부 저장 및 시작</button>
    </div>

    <!-- 3. 메인 메뉴 -->
    <div id="sec-main" class="section">
        <p id="welcome-msg" style="text-align:center; font-weight:bold; font-size:18px;"></p>
        <div class="menu-grid">
            <div class="menu-item" onclick="showSubPage('칭찬 스티커')">
                <img src="images/sticker.png" style="width: 100%; max-width: 80px; border-radius: 10px;">
                <div class="menu-label">칭찬스티커</div>
            </div>
            <div class="menu-item" onclick="showSubPage('독서 기록')">
                <img src="images/book.png" style="width: 100%; max-width: 80px; border-radius: 10px;">
                <div class="menu-label">독서기록</div>
            </div>
            <div class="menu-item" onclick="showSubPage('일기 기록')">
                <img src="images/diary.png" style="width: 100%; max-width: 80px; border-radius: 10px;">
                <div class="menu-label">일기기록</div>
            </div>
            <div class="menu-item" onclick="showSubPage('우리반 스티커')">
                <img src="images/trophy.png" style="width: 100%; max-width: 80px; border-radius: 10px;">
                <div class="menu-label">우리반스티커</div>
            </div>
        </div>
    </div>

    <!-- 4. 하위 목록 섹션 (학생 명단 보여주는 곳) -->
    <div id="sec-sub" class="section">
        <button class="back-btn" onclick="goBack()">← 뒤로가기</button>
        <h3 id="sub-title" style="text-align: center; color: #2d3436;">메뉴 이름</h3>
        <div id="student-display-list" class="scroll-list">
            <!-- 자바스크립트가 여기에 학생 명단을 생성합니다 -->
        </div>
    </div>

    <!-- 5. 상세 기록 섹션 (스티커 찍거나 일기 쓰는 곳) -->
    <div id="sec-detail" class="section">
        <button class="back-btn" onclick="changeSection('sec-sub')">← 목록으로</button>
        <h2 id="detail-student-name" style="text-align: center; color: #0984e3;">학생 이름</h2>
        <div id="detail-interface">
            <!-- 상세 UI가 여기에 생성됩니다 -->
        </div>
    </div>

</div>

<script>
    /* 아래 스크립트 코드는 선생님이 기존에 잘 작성해주신 파이어베이스 로직을 그대로 유지합니다 */
    const firebaseConfig = {
        apiKey: "AIzaSyBKVYFPnLoBZ9bKjjE1SfJXBQKiV4fssj4",
        authDomain: "smart-class2-record.firebaseapp.com",
        projectId: "smart-class2-record",
        storageBucket: "smart-class2-record.firebasestorage.app",
        messagingSenderId: "479464373449",
        appId: "1:479464373449:web:790a0def84c615f4396118"
    };

    firebase.initializeApp(firebaseConfig);
    const fs = firebase.firestore();

    let currentClassName = "";
    let currentRoster = [];
    let classData = {};

    const rosterDiv = document.getElementById('roster-inputs');
    for(let i=1; i<=30; i++) {
        rosterDiv.innerHTML += `<div class="roster-row"><span class="num-box">${i}</span><input type="text" class="input-field" id="name-${i}" style="margin:2px 0;" placeholder="학생 이름"></div>`;
    }

    async function handleLogin() {
        const className = document.getElementById('c-name').value.trim();
        const pw = document.getElementById('c-pw').value.trim();
        if(!className || !pw) return alert("학급 이름과 비밀번호를 입력해주세요.");

        const docRef = fs.collection("classes").doc(className);
        const docSnap = await docRef.get();

        if (!docSnap.exists) {
            if(confirm(`'${className}' 학급이 없습니다. 새로 만드시겠습니까?`)) {
                classData = { password: pw, roster: [], classStickers: 0, rewardText: "보상을 입력하세요" };
                await docRef.set(classData);
                enterMain(className, []);
            }
        } else {
            const data = docSnap.data();
            if(data.password === pw) {
                classData = data;
                enterMain(className, data.roster);
            } else {
                alert("비밀번호가 틀립니다.");
            }
        }
    }

    function enterMain(className, roster) {
        currentClassName = className;
        currentRoster = roster;
        document.getElementById('welcome-msg').innerText = "✨ " + className;
        changeSection(currentRoster.length === 0 ? 'sec-setup' : 'sec-main');
    }

    async function saveAndGoMain() {
        currentRoster = [];
        for(let i=1; i<=30; i++) {
            const name = document.getElementById(`name-${i}`).value.trim();
            if(name) {
                currentRoster.push({
                    num: i, name: name, stickers: new Array(30).fill(false),
                    readingCount: 0, diaryDates: []
                });
            }
        }
        await saveDB();
        changeSection('sec-main');
    }

    async function saveDB() {
        if(!currentClassName) return;
        await fs.collection("classes").doc(currentClassName).update({
            roster: currentRoster,
            classStickers: classData.classStickers || 0,
            rewardText: classData.rewardText || ""
        });
    }

    function showSubPage(title) {
        // [수정] id="sub-title"에 제목을 넣고, sec-sub 화면을 보여줍니다.
        document.getElementById('sub-title').innerText = title;
        const listDiv = document.getElementById('student-display-list');
        listDiv.innerHTML = "";

        if (title === '우리반 스티커') {
            renderClassStickerPage(listDiv);
        } else {
            currentRoster.forEach((std, idx) => {
                let summary = "";
                if(title === '칭찬 스티커') summary = `⭐ ${std.stickers.filter(s => s).length}`;
                if(title === '독서 기록') summary = `📖 ${std.readingCount}권`;
                if(title === '일기 기록') summary = std.diaryDates.length > 0 ? `📅 ${std.diaryDates[std.diaryDates.length-1]}` : "기록 없음";

                listDiv.innerHTML += `
                    <div class="record-row" onclick="openDetail(${idx}, '${title}')">
                        <span><b>${std.num}.</b> ${std.name}</span>
                        <span style="color:#e67e22; font-size:14px;">${summary}</span>
                    </div>`;
            });
        }
        changeSection('sec-sub');
    }

    function openDetail(idx, title) {
        const std = currentRoster[idx];
        document.getElementById('detail-student-name').innerText = `${std.name} (${title})`;
        const ui = document.getElementById('detail-interface');
        ui.innerHTML = "";

        if(title === '칭찬 스티커') renderPersonalStickers(idx, ui);
        else if(title === '독서 기록') renderReadingTool(idx, ui);
        else if(title === '일기 기록') renderDiaryTool(idx, ui);

        changeSection('sec-detail');
    }

    function renderPersonalStickers(idx, container) {
        const std = currentRoster[idx];
        container.innerHTML = `<p style="text-align:center;">현재 스티커: <b>${std.stickers.filter(s => s).length}</b> / 30</p><div class="sticker-grid" id="st-grid"></div>`;
        const grid = document.getElementById('st-grid');
        std.stickers.forEach((on, sIdx) => {
            const cell = document.createElement('div');
            cell.className = 'sticker-cell' + (on ? ' on' : '');
            cell.innerText = sIdx + 1;
            cell.onclick = async () => {
                std.stickers[sIdx] = !std.stickers[sIdx];
                await saveDB();
                renderPersonalStickers(idx, container);
            };
            grid.appendChild(cell);
        });
    }

    function renderReadingTool(idx, container) {
        const std = currentRoster[idx];
        container.innerHTML = `
            <div class="reading-display">📖 총 ${std.readingCount}권 읽음</div>
            <div style="display:flex; gap:10px;">
                <button class="btn-blue" onclick="updateReading(${idx}, 1)">+ 1권 추가</button>
                <button class="btn-blue" style="background:#e74c3c" onclick="updateReading(${idx}, -1)">- 1권 차감</button>
            </div>`;
    }

    async function updateReading(idx, val) {
        currentRoster[idx].readingCount = Math.max(0, currentRoster[idx].readingCount + val);
        await saveDB();
        renderReadingTool(idx, document.getElementById('detail-interface'));
    }

    function renderDiaryTool(idx, container) {
        const std = currentRoster[idx];
        container.innerHTML = `
            <div style="margin-bottom:15px; display:flex; gap:5px;">
                <input type="text" id="diary-date-in" class="input-field" placeholder="날짜 입력 (예: 3/10)" style="flex:1;">
                <button class="btn-blue" onclick="addDiaryDate(${idx})" style="width:80px;">추가</button>
            </div>
            <div style="background:#fff; border:1px solid #dfe6e9; border-radius:10px; padding:10px;">
                <div id="diary-grid" style="display:grid; grid-template-columns: repeat(5, 1fr); gap:5px;"></div>
            </div>
            <p style="font-size:12px; color:#636e72; margin-top:10px; text-align:right;">총 ${std.diaryDates.length}회 기록됨</p>
        `;

        const grid = document.getElementById('diary-grid');
        for (let i = 0; i < 50; i++) {
            const cell = document.createElement('div');
            cell.style.cssText = `aspect-ratio: 1.5 / 1; border: 1px solid #f1f2f6; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; background: ${std.diaryDates[i] ? '#e1f5fe' : '#fff'}; color: ${std.diaryDates[i] ? '#0288d1' : '#dfe6e9'}; font-weight: ${std.diaryDates[i] ? 'bold' : 'normal'};`;
            cell.innerText = std.diaryDates[i] ? std.diaryDates[i] : (i + 1);
            if(std.diaryDates[i]) {
                cell.onclick = async () => {
                    if(confirm(`'${std.diaryDates[i]}' 기록을 삭제할까요?`)) {
                        std.diaryDates.splice(i, 1);
                        await saveDB();
                        renderDiaryTool(idx, container);
                    }
                };
            }
            grid.appendChild(cell);
        }
    }

    async function addDiaryDate(idx) {
        const dateIn = document.getElementById('diary-date-in');
        const date = dateIn.value.trim();
        if(!date) return;
        if(currentRoster[idx].diaryDates.length >= 50) return alert("최대 50회까지만 기록할 수 있습니다.");
        currentRoster[idx].diaryDates.push(date);
        await saveDB();
        renderDiaryTool(idx, document.getElementById('detail-interface'));
        dateIn.value = "";
        dateIn.focus();
    }

    function renderClassStickerPage(container) {
        let score = classData.classStickers || 0;
        container.innerHTML = `
            <div class="reward-box">
                <span style="font-weight:bold; color:#0984e3;">🏆 보상 기준 (수정 시 자동저장)</span>
                <textarea id="reward-ta" class="reward-input" rows="3">${classData.rewardText || ""}</textarea>
            </div>
            <div class="class-goal-bar" id="goal-bar"></div>
            <div style="text-align:center;">
                <h1 style="font-size:24px; color:#f1c40f;">현재 점수: ${score} / 30</h1>
                <div style="display:flex; gap:10px;">
                    <button class="btn-blue" onclick="updateClassScore(1)">+ 1점</button>
                    <button class="btn-blue" style="background:#e74c3c" onclick="updateClassScore(-1)">- 1점</button>
                </div>
            </div>`;
        
        document.getElementById('reward-ta').onblur = async (e) => {
            classData.rewardText = e.target.value;
            await saveDB();
        };

        const bar = document.getElementById('goal-bar');
        for(let i=1; i<=30; i++) {
            bar.innerHTML += `<div class="goal-cell ${i <= score ? 'filled' : ''}">${i%5==0?i:''}</div>`;
        }
    }

    async function updateClassScore(val) {
        classData.classStickers = Math.max(0, Math.min(30, (classData.classStickers || 0) + val));
        await saveDB();
        renderClassStickerPage(document.getElementById('student-display-list'));
    }

    function changeSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        const target = document.getElementById(id);
        if(target) target.classList.add('active');
        window.scrollTo(0, 0);
    }

    function goBack() { changeSection('sec-main'); }
</script>

</body>
