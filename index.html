<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>슬기로운 기록생활</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #f8f9fa; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 450px; background: white; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); min-height: 95vh; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }
        h1 { text-align: center; color: #2d3436; font-size: 22px; margin-bottom: 10px; }
        .btn-blue { width: 100%; padding: 15px; background: #0984e3; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .input-field { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #dfe6e9; border-radius: 8px; box-sizing: border-box; }
        .section { display: none; }
        .active { display: block; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .menu-item { background: #f1f2f6; padding: 30px 10px; border-radius: 20px; text-align: center; cursor: pointer; }
        .icon { font-size: 35px; display: block; margin-bottom: 10px; }
        .menu-label { font-weight: bold; font-size: 14px; }
        .scroll-list { max-height: 400px; overflow-y: auto; border: 1px solid #f1f2f6; padding: 10px; border-radius: 10px; }
        .record-row { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid #f1f2f6; }
        .back-btn { background: #636e72; color: white; padding: 8px 15px; border-radius: 8px; border: none; margin-bottom: 15px; }
        
        .sticker-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 10px; }
        .sticker-cell { aspect-ratio: 1; border: 1px solid #dfe6e9; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #dfe6e9; cursor: pointer; }
        .sticker-cell.on { background-color: #ffeaa7; border-color: #fdcb6e; color: #fab1a0; }
        .sticker-cell.on::after { content: '⭐'; font-size: 16px; }
        
        .reward-box { background: #f9f9f9; padding: 15px; border-radius: 15px; border: 1px dashed #0984e3; margin-bottom: 20px; }
        .reward-title { font-weight: bold; color: #0984e3; margin-bottom: 10px; display: block; }
        .reward-input { width: 100%; border: none; background: transparent; font-size: 14px; color: #2d3436; resize: none; outline: none; }

        /* 학급 막대그래프 스타일 */
        .class-goal-bar { display: flex; border: 2px solid #ddd; border-radius: 10px; overflow: hidden; height: 40px; margin: 20px 0; background: #eee; }
        .goal-cell { flex: 1; border-right: 1px solid #ccc; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #999; }
        .goal-cell:last-child { border-right: none; }
        .goal-cell.filled { background-color: #f1c40f; color: white; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>🌱 슬기로운 기록생활</h1>

    <div id="sec-login" class="section active">
        <p style="text-align: center; color: #636e72;">학급 관리 로그인</p>
        <input type="text" id="c-name" class="input-field" placeholder="학급 이름 (예: 2학년1반)">
        <input type="password" id="c-pw" class="input-field" placeholder="비밀번호">
        <button class="btn-blue" onclick="handleLogin()">시작하기</button>
    </div>

    <div id="sec-setup" class="section">
        <h3>우리 반 명부 작성 (최대 30명)</h3>
        <div class="scroll-list" id="roster-inputs"></div>
        <button class="btn-blue" onclick="saveAndGoMain()">명부 저장 및 시작</button>
    </div>

    <div id="sec-main" class="section">
        <p id="welcome-msg" style="text-align:center; font-weight:bold; font-size:18px;"></p>
        <div class="menu-grid">
            <div class="menu-item" onclick="showSubPage('칭찬 스티커')">
                <span class="icon">🏷️</span> <span class="menu-label">칭찬스티커</span>
            </div>
            <div class="menu-item" onclick="showSubPage('독서 기록')">
                <span class="icon">📚</span> <span class="menu-label">독서기록</span>
            </div>
            <div class="menu-item" onclick="showSubPage('일기 기록')">
                <span class="icon">📝</span> <span class="menu-label">일기기록</span>
            </div>
            <div class="menu-item" onclick="showSubPage('우리반 스티커')">
                <span class="icon">🏆</span> <span class="menu-label">우리반스티커</span>
            </div>
        </div>
        <button class="btn-blue" style="background:#b2bec3; margin-top:30px;" onclick="location.reload()">로그아웃</button>
    </div>

    <div id="sec-sub" class="section">
        <button class="back-btn" onclick="goBack()">← 뒤로가기</button>
        <h3 id="sub-title">메뉴 이름</h3>
        <div id="student-display-list"></div>
    </div>

    <div id="sec-detail" class="section">
        <button class="back-btn" onclick="changeSection('sec-sub')">← 목록으로</button>
        <h3 id="detail-name">학생 이름</h3>
        <p>스티커 개수: <span id="sticker-count" style="font-weight:bold; color:#e67e22;">0</span> / 30</p>
        <div class="sticker-grid" id="sticker-board"></div>
    </div>
</div>

<script>
    let currentClassName = "";
    let currentRoster = [];
    let db = JSON.parse(localStorage.getItem('classAppDB')) || {};

    const rosterDiv = document.getElementById('roster-inputs');
    for(let i=1; i<=30; i++) {
        rosterDiv.innerHTML += `
            <div class="roster-row">
                <span class="num-box">${i}</span>
                <input type="text" class="input-field" id="name-${i}" style="margin:2px 0;" placeholder="학생 이름">
            </div>
        `;
    }

    function handleLogin() {
        const className = document.getElementById('c-name').value.trim();
        const pw = document.getElementById('c-pw').value.trim();
        if(!className || !pw) return alert("학급 이름과 비밀번호를 입력해주세요.");

        if(!db[className]) {
            db[className] = { password: pw, roster: [], classStickers: 0, rewardText: "5개 완성 시 교실 놀이\n10개 완성 시 영화 감상\n15개 완성 시 과자 파티" };
            localStorage.setItem('classAppDB', JSON.stringify(db));
            enterMain(className, []);
        } else {
            if(db[className].password === pw) {
                enterMain(className, db[className].roster);
            } else { alert("이미 존재하는 학급명이거나 비번이 틀립니다."); }
        }
    }

    function enterMain(className, roster) {
        currentClassName = className;
        currentRoster = roster;
        document.getElementById('welcome-msg').innerText = "✨ " + className;
        changeSection(currentRoster.length === 0 ? 'sec-setup' : 'sec-main');
    }

    function saveAndGoMain() {
        currentRoster = [];
        for(let i=1; i<=30; i++) {
            const val = document.getElementById(`name-${i}`).value.trim();
            if(val) {
                currentRoster.push({ num: i, name: val, stickers: new Array(30).fill(false) });
            }
        }
        db[currentClassName].roster = currentRoster;
        localStorage.setItem('classAppDB', JSON.stringify(db));
        changeSection('sec-main');
    }

    function showSubPage(title) {
        document.getElementById('sub-title').innerText = title;
        const listDiv = document.getElementById('student-display-list');
        listDiv.innerHTML = "";

        if (title === '우리반 스티커') {
            renderClassStickerPage(listDiv);
        } else {
            currentRoster.forEach((std, idx) => {
                listDiv.innerHTML += `
                    <div class="record-row" onclick="openDetail(${idx}, '${title}')">
                        <span><b>${std.num}.</b> ${std.name}</span>
                        <span style="color:#e67e22;">★ ${std.stickers.filter(s => s).length}</span>
                    </div>
                `;
            });
        }
        changeSection('sec-sub');
    }

    function openDetail(idx, title) {
        if(title !== '칭찬 스티커') return;
        const std = currentRoster[idx];
        document.getElementById('detail-name').innerText = std.name + "의 스티커 판";
        renderStickerBoard(idx);
        changeSection('sec-detail');
    }

    function renderStickerBoard(stdIdx) {
        const board = document.getElementById('sticker-board');
        const std = currentRoster[stdIdx];
        board.innerHTML = "";
        std.stickers.forEach((on, sIdx) => {
            const cell = document.createElement('div');
            cell.className = 'sticker-cell' + (on ? ' on' : '');
            cell.innerText = sIdx + 1;
            cell.onclick = () => {
                std.stickers[sIdx] = !std.stickers[sIdx];
                db[currentClassName].roster = currentRoster;
                localStorage.setItem('classAppDB', JSON.stringify(db));
                renderStickerBoard(stdIdx);
            };
            board.appendChild(cell);
        });
        document.getElementById('sticker-count').innerText = std.stickers.filter(s => s).length;
    }

    function renderClassStickerPage(container) {
        let classScore = db[currentClassName].classStickers || 0;
        let rewardNote = db[currentClassName].rewardText || "";
        
        container.innerHTML = `
            <div class="reward-box">
                <span class="reward-title">🏆 학급 보상 기준 (수정 가능)</span>
                <textarea class="reward-input" id="reward-editor" rows="3" onblur="saveRewardText()">${rewardNote}</textarea>
            </div>
            
            <div class="class-goal-bar" id="goal-bar">
                </div>
            
            <div style="text-align:center; padding:10px;">
                <h1 style="font-size:30px; color:#f1c40f; margin:10px 0;">현재 점수: ${classScore} / 30</h1>
                <div style="display:flex; gap:10px;">
                    <button class="btn-blue" onclick="updateClassScore(1)">+ 1점 추가</button>
                    <button class="btn-blue" style="background:#e74c3c" onclick="updateClassScore(-1)">- 1점 차감</button>
                </div>
            </div>
        `;
        renderGoalBar(classScore);
    }

    function renderGoalBar(score) {
        const bar = document.getElementById('goal-bar');
        bar.innerHTML = "";
        for(let i=1; i<=30; i++) {
            const cell = document.createElement('div');
            cell.className = 'goal-cell' + (i <= score ? ' filled' : '');
            if(i % 5 === 0) cell.innerText = i; // 5칸마다 숫자 표시
            bar.appendChild(cell);
        }
    }

    function saveRewardText() {
        const text = document.getElementById('reward-editor').value;
        db[currentClassName].rewardText = text;
        localStorage.setItem('classAppDB', JSON.stringify(db));
    }

    function updateClassScore(val) {
        let currentScore = db[currentClassName].classStickers || 0;
        let newScore = Math.max(0, Math.min(30, currentScore + val)); // 0~30 사이로 제한
        
        db[currentClassName].classStickers = newScore;
        localStorage.setItem('classAppDB', JSON.stringify(db));
        renderClassStickerPage(document.getElementById('student-display-list'));
    }

    function changeSection(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
    function goBack() { changeSection('sec-main'); }
</script>

</body>
</html>
